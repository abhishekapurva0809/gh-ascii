name: Generate and Update GitHub Profile Card

on:
  schedule:
    # Run automatically every 6 hours at minute 17
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-ascii generator repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate updated profile card SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run generate

      - name: Verify generated SVGs
        run: |
          if [ ! -f dark_mode.svg ] || [ ! -f light_mode.svg ]; then
            echo "❌ Error: SVG files dark_mode.svg and light_mode.svg were not generated!"
            exit 1
          fi
          echo "✅ Successfully verified dark_mode.svg and light_mode.svg exist."

      - name: Commit and push SVGs to gh-ascii generator repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -n "$(git status --porcelain dark_mode.svg light_mode.svg)" ]; then
            git add dark_mode.svg light_mode.svg
            git commit -m "ci: update generated profile card SVGs [skip ci]"
            git push
            echo "✅ Updated profile card SVGs pushed to gh-ascii repository."
          else
            echo "ℹ️ No changes detected in dark_mode.svg or light_mode.svg for gh-ascii. Skipping commit."
          fi

      - name: Checkout profile repository (abhishekapurva0809/abhishekapurva0809)
        uses: actions/checkout@v4
        with:
          repository: abhishekapurva0809/abhishekapurva0809
          token: ${{ secrets.PROFILE_REPO_PAT }}
          path: profile_repo
          persist-credentials: false

      - name: Update profile repository
        env:
          PROFILE_REPO_PAT: ${{ secrets.PROFILE_REPO_PAT }}
        run: |
          if [ -z "$PROFILE_REPO_PAT" ]; then
            echo "⚠️ PROFILE_REPO_PAT is not configured."
            exit 0
          fi

          cp dark_mode.svg profile_repo/dark_mode.svg
          cp light_mode.svg profile_repo/light_mode.svg

          cd profile_repo

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -n "$(git status --porcelain dark_mode.svg light_mode.svg)" ]; then
            git add dark_mode.svg light_mode.svg
            git commit -m "ci: update profile card SVGs from gh-ascii [skip ci]"

            AUTH_HEADER=$(printf 'x-access-token:%s' "$PROFILE_REPO_PAT" | base64 -w 0)
            git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:main

            echo "✅ Successfully updated profile repository."
          else
            echo "ℹ️ No changes detected. Skipping commit."
          fi
